name: Generate approved PWA icons once

on:
  push:
    branches:
      - fix/pwa-icons-20260918
    paths:
      - ".github/workflows/generate-approved-pwa-icons.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pwa-icons-20260918

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate and validate PNG icons
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image

          parts = []
          for i in range(6):
              text = Path(f"lib/pwa-icon-source/part{i}.ts").read_text()
              match = re.search(rf'const part{i} = "([A-Za-z0-9+/=]+)";', text)
              if not match:
                  raise RuntimeError(f"Could not parse part{i}")
              parts.append(match.group(1))

          raw = base64.b64decode("".join(parts), validate=True)
          master = Image.open(io.BytesIO(raw)).convert("RGB")
          if master.size != (512, 512):
              raise RuntimeError(f"Unexpected master size: {master.size}")

          out = Path("public/pwa")
          out.mkdir(parents=True, exist_ok=True)

          icon512 = master.resize((512, 512), Image.Resampling.LANCZOS)
          icon192 = master.resize((192, 192), Image.Resampling.LANCZOS)

          maskable = Image.new("RGB", (512, 512), "white")
          safe = master.resize((410, 410), Image.Resampling.LANCZOS)
          maskable.paste(safe, ((512 - 410) // 2, (512 - 410) // 2))

          icon192.save(out / "icon-v6-192.png", format="PNG", optimize=True)
          icon512.save(out / "icon-v6.png", format="PNG", optimize=True)
          maskable.save(out / "icon-v6-maskable.png", format="PNG", optimize=True)

          expected = {
              "icon-v6-192.png": (192, 192),
              "icon-v6.png": (512, 512),
              "icon-v6-maskable.png": (512, 512),
          }
          for name, dimensions in expected.items():
              path = out / name
              data = path.read_bytes()
              if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise RuntimeError(f"{name}: invalid PNG signature")
              if not data.endswith(b"IEND\xaeB\x60\x82"):
                  raise RuntimeError(f"{name}: missing PNG IEND")
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if image.size != dimensions or image.format != "PNG":
                      raise RuntimeError(f"{name}: invalid image metadata")
              print(f"{name}: {len(data)} bytes, {dimensions[0]}x{dimensions[1]}, valid PNG")
          PY

      - name: Point TrackDash manifests at regenerated icons
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          replacements = {
              "/pwa-icons/192": "/pwa/icon-v6-192.png",
              "/pwa-icons/512": "/pwa/icon-v6.png",
              "/pwa-icons/maskable": "/pwa/icon-v6-maskable.png",
          }

          for filename in [
              "app/manifest.ts",
              "app/layout.tsx",
              "public/pwa-debug/lab-20260918/manifest.webmanifest",
          ]:
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          proxy = Path("proxy.ts")
          text = proxy.read_text().replace('  "/pwa-icons",\n', "")
          proxy.write_text(text)
          PY

          rm -rf app/pwa-icons lib/pwa-icon-source

      - name: Commit generated icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: regenerate valid TrackDash PWA icons"
          git push origin HEAD:fix/pwa-icons-20260918
