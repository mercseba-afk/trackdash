name: Neo-Tridagger image probe

on:
  pull_request:
    branches:
      - main

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact product pages
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from urllib.parse import urljoin

          pages = {
              "94647_rcjaz": "https://www.rcjaz.ca/tamiya-neo-tridagger-zmc-special-kit-94647-p-80003593.html",
              "94647_hlj": "https://www.hlj.com/neo-tridagger-zmc-special-kit-w-tridagger-x-body-tam94647",
              "92277_suruga": "https://www.suruga-ya.jp/product/detail/603052144",
              "92278_suruga": "https://www.suruga-ya.jp/product/detail/603052145",
              "92279_suruga": "https://www.suruga-ya.jp/product/detail/603052146",
              "92280_suruga": "https://www.suruga-ya.jp/product/detail/603052147",
              "92277_tamiyablog": "https://tamiyablog.com/2014/09/neo-tri-dagger-zmc/",
              "92277_mercari_shop": "https://jp.mercari.com/shops/product/6EeryZA9B3GCBVxGfoex6F",
              "92278_mercari": "https://jp.mercari.com/item/m15829754498",
              "92280_mercari": "https://jp.mercari.com/item/m62676061261",
              "92279_mercari_search": "https://jp.mercari.com/search?keyword=92279%20%E3%83%8D%E3%82%AA%E3%83%88%E3%83%A9%E3%82%A4%E3%83%80%E3%82%AC%E3%83%BCZMC%E3%83%8D%E3%82%AF%E3%82%B9%E3%83%88",
              "92279_mandarake_shop_neighbor": "https://jp.mercari.com/shops/product/VqvP8pdk3N8vMtfLvJyyQa",
          }
          ua = "Mozilla/5.0 (compatible; TrackDash image audit/1.0)"
          for key, url in pages.items():
              print("\n===", key, url)
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":ua})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw=r.read().decode("utf-8","ignore")
                      print("HTTP",r.status,"FINAL",r.geturl(),"LEN",len(raw))
              except Exception as e:
                  print("FETCH_ERROR",repr(e))
                  continue

              found=[]
              patterns=[
                  r'<meta[^>]+(?:property|name)=["\']og:image(?::secure_url)?["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\']og:image(?::secure_url)?["\']',
                  r'<meta[^>]+(?:property|name)=["\']twitter:image(?::src)?["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<img[^>]+(?:src|data-src|data-original)=["\']([^"\']+)["\']',
              ]
              for pat in patterns:
                  for m in re.finditer(pat, raw, re.I):
                      u=html.unescape(m.group(1)).strip()
                      if not u or u.startswith("data:"):
                          continue
                      u=urljoin(url,u)
                      if u not in found:
                          found.append(u)
              if key == "92279_mandarake_shop_neighbor":
                  decoded2=html.unescape(raw).replace("\\/","/")
                  for m2 in re.finditer("92279",decoded2):
                      sn=decoded2[max(0,m2.start()-7000):m2.start()+12000]
                      hrefs2=re.findall(r'href="([^"]+)"',sn,re.I)
                      srcs2=re.findall(r'(?:src|data-src)="([^"]+)"',sn,re.I)
                      print("NEIGHBOR_92279_POS",m2.start())
                      print("NEIGHBOR_92279_HREFS",hrefs2[:80])
                      print("NEIGHBOR_92279_SRCS",srcs2[:80])
                      print("NEIGHBOR_92279_SNIP",re.sub(r"\\s+"," ",sn)[:15000])
                      break
              for i,u in enumerate(found[:120],1):
                  marker=""
                  low=u.lower()
                  if any(x in low for x in ["94647","603052144","603052145","603052146","603052147","92277","92278","92279","92280","tridagger","neo","mercdn","susercontent"]):
                      marker="  <== LIKELY"
                  print(f"IMG {i:03d} {u}{marker}")
              if "92279_mercari_search" == key:
                  pos=raw.find("92279")
                  print("SEARCH_92279_POS",pos)
                  if pos >= 0:
                      snippet=raw[max(0,pos-5000):pos+10000]
                      print("SEARCH_92279_SNIPPET_BEGIN")
                      print(snippet.replace("\\n"," ")[:15000])
                      print("SEARCH_92279_SNIPPET_END")
                  decoded=html.unescape(raw).replace("\\/","/")
                  static_urls=[]
                  for m in re.finditer(r'https://static\.mercdn\.net/[^"\\\\<> ]+',decoded):
                      u=m.group(0).replace('\\u0026','&')
                      if u not in static_urls:
                          static_urls.append(u)
                  print("SEARCH_92279_STATIC_URLS",len(static_urls))
                  for i,u in enumerate(static_urls[:200],1):
                      print(f"MERC_IMG {i:03d} {u}")
                  title='ネオトライダガーZMCネクスト(ホワイト)'
                  for label in [title,'92279','ホワイト']:
                      print("LABEL",label)
                      start=0
                      hits=0
                      while True:
                          p=decoded.find(label,start)
                          if p<0 or hits>=20: break
                          nearby=decoded[max(0,p-2500):p+5000]
                          links=re.findall(r'(?:/item/m\\d+|/shops/product/[A-Za-z0-9]+|https://static\.mercdn\.net/[^"\\\\<> ]+)',nearby)
                          print("HIT",hits+1,"POS",p,"LINKS",links[:20])
                          hits+=1
                          start=p+len(label)
                  ids=[]
                  for pat in [r'm\\d{10,14}', r'm%5C%5Cd{10,14}']:
                      for m in re.finditer(pat,decoded):
                          val=m.group(0)
                          if val not in ids:
                              ids.append(val)
                  print("SEARCH_MERCARI_ITEM_IDS",ids[:100])
                  for item_id in [x for x in ids if x.startswith("m")][:40]:
                      item_url="https://jp.mercari.com/item/"+item_id
                      try:
                          req2=urllib.request.Request(item_url, headers={"User-Agent":ua})
                          with urllib.request.urlopen(req2,timeout=15) as rr:
                              body=rr.read().decode("utf-8","ignore")
                          tm=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                          title_text=html.unescape(re.sub(r'<[^>]+>','',tm.group(1))).strip() if tm else ""
                          if "92279" in body or "ホワイト" in body or "92279" in title_text:
                              print("WHITE_ITEM",item_id,"TITLE",title_text)
                              ims=[]
                              for pat2 in patterns:
                                  for mm in re.finditer(pat2,body,re.I):
                                      uu=html.unescape(mm.group(1)).strip()
                                      if uu and not uu.startswith("data:"):
                                          uu=urljoin(item_url,uu)
                                          if uu not in ims: ims.append(uu)
                              print("WHITE_IMAGES",ims[:20])
                      except Exception as e:
                          print("ITEM_FETCH_ERROR",item_id,repr(e))
          PY
      - name: Render Mercari search for 92279
        shell: bash
        run: |
          URL='https://jp.mercari.com/search?keyword=92279%20%E3%83%8D%E3%82%AA%E3%83%88%E3%83%A9%E3%82%A4%E3%83%80%E3%82%AC%E3%83%BCZMC%E3%83%8D%E3%82%AF%E3%82%B9%E3%83%88'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          echo "CHROME=$CHROME"
          if [ -z "$CHROME" ]; then exit 0; fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom "$URL" > /tmp/mercari-92279.html 2>/tmp/chrome.err || true
          python3 - <<'PY'
          import re, html
          raw=open('/tmp/mercari-92279.html','r',encoding='utf-8',errors='ignore').read()
          print('RENDER_LEN',len(raw))
          target='92279'
          for m in re.finditer(target,raw):
              s=raw[max(0,m.start()-6000):m.start()+12000]
              hrefs=re.findall(r"href=[\\\"']([^\\\"']+)[\\\"']",s,re.I)
              imgs=re.findall(r"(?:src|data-src)=[\\\"']([^\\\"']+)[\\\"']",s,re.I)
              if any('ホワイト' in x or 'White' in x for x in [html.unescape(s)]):
                  print('WHITE_RENDER_POS',m.start())
                  print('WHITE_RENDER_HREFS',hrefs[:50])
                  print('WHITE_RENDER_IMGS',imgs[:50])
                  print('WHITE_RENDER_SNIP',re.sub(r'\\s+',' ',html.unescape(s))[:12000])
                  break
          PY
