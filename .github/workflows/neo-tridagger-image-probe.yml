name: Neo-Tridagger image probe

on:
  push:
    branches:
      - neo-tridagger-image-fill-20260924

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact product pages
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import re
          import urllib.request
          from urllib.parse import urljoin

          pages = {
              "94647_rcjaz": "https://www.rcjaz.ca/tamiya-neo-tridagger-zmc-special-kit-94647-p-80003593.html",
              "94647_hlj": "https://www.hlj.com/neo-tridagger-zmc-special-kit-w-tridagger-x-body-tam94647",
              "92277_suruga": "https://www.suruga-ya.jp/product/detail/603052144",
              "92278_suruga": "https://www.suruga-ya.jp/product/detail/603052145",
              "92279_suruga": "https://www.suruga-ya.jp/product/detail/603052146",
              "92280_suruga": "https://www.suruga-ya.jp/product/detail/603052147",
              "92277_tamiyablog": "https://tamiyablog.com/2014/09/neo-tri-dagger-zmc/",
          }
          ua = "Mozilla/5.0 (compatible; TrackDash image audit/1.0)"
          for key, url in pages.items():
              print("\n===", key, url)
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":ua})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw=r.read().decode("utf-8","ignore")
                      print("HTTP",r.status,"FINAL",r.geturl(),"LEN",len(raw))
              except Exception as e:
                  print("FETCH_ERROR",repr(e))
                  continue

              found=[]
              patterns=[
                  r'<meta[^>]+(?:property|name)=["\']og:image(?::secure_url)?["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\']og:image(?::secure_url)?["\']',
                  r'<meta[^>]+(?:property|name)=["\']twitter:image(?::src)?["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<img[^>]+(?:src|data-src|data-original)=["\']([^"\']+)["\']',
              ]
              for pat in patterns:
                  for m in re.finditer(pat, raw, re.I):
                      u=html.unescape(m.group(1)).strip()
                      if not u or u.startswith("data:"):
                          continue
                      u=urljoin(url,u)
                      if u not in found:
                          found.append(u)
              for i,u in enumerate(found[:60],1):
                  marker=""
                  low=u.lower()
                  if any(x in low for x in ["94647","603052144","603052145","603052146","603052147","92277","92278","92279","92280","tridagger","neo"]):
                      marker="  <== LIKELY"
                  print(f"IMG {i:02d} {u}{marker}")
          PY
