name: Market Audit v1 CI

on:
  push:
    branches:
      - feat/market-audit-v1-20260918
    paths:
      - ".github/workflows/market-audit-v1-ci.yml"
      - "lib/market/audit.ts"
      - "lib/market/pipeline/market-model.ts"
      - "lib/market/pipeline/market-publication-policy.ts"
      - "lib/market/pipeline/market-r3-repository.ts"
      - "scripts/test-market-audit-v1.mjs"
      - "scripts/test-market-r3.mjs"
      - "scripts/test-market-method-v2.mjs"
      - "package.json"
      - "lib/db/schema/market.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm market:r3:test
      - run: pnpm market:method:test
      - run: pnpm market:audit:test
