name: TrackDash Production HTTP Smoke

# Vercel deploys main independently; wait for /api/version to equal the push SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trackdash-production-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test failure and auth-redirect cases
        run: node --test scripts/test-smoke-production.mjs
      - name: Verify deployed SHA and seven HTML page routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/smoke-production.mjs
