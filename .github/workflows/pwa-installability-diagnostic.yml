name: PWA installability diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pwa-installability-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: A/B test TrackDash manifest icon selection in Chrome
        shell: bash
        run: |
          set -euo pipefail

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi

          "$CHROME_BIN" --version
          npm install --no-save --ignore-scripts chrome-remote-interface@0.33.3

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/trackdash-pwa-profile \
            about:blank >/tmp/trackdash-chrome.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const CDP = require('chrome-remote-interface')
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          const variants = {
            baseline: (manifest) => manifest,
            legacyV4: (manifest) => ({
              ...manifest,
              icons: [
                { src: '/pwa/icon-v4.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: '/pwa/icon-v4.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
              ],
            }),
            v5SingleAny512: (manifest) => ({
              ...manifest,
              icons: [
                { src: '/pwa/icon-v5.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
              ],
            }),
            v5PurposeOmitted: (manifest) => ({
              ...manifest,
              icons: [
                { src: '/pwa/icon-v5-192.png', sizes: '192x192', type: 'image/png' },
                { src: '/pwa/icon-v5.png', sizes: '512x512', type: 'image/png' },
              ],
            }),
            v5AnyMaskable: (manifest) => ({
              ...manifest,
              icons: [
                { src: '/pwa/icon-v5-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: '/pwa/icon-v5.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
              ],
            }),
            v5SizeAny: (manifest) => ({
              ...manifest,
              icons: [
                { src: '/pwa/icon-v5.png', sizes: 'any', type: 'image/png', purpose: 'any' },
              ],
            }),
          }

          ;(async () => {
            const client = await CDP({ port: 9222 })
            const { Page, Network, Emulation, Fetch } = client
            let activeVariant = 'baseline'

            Fetch.requestPaused(({ requestId, request }) => {
              ;(async () => {
                if (request.url === 'https://trackdash.it/manifest.webmanifest') {
                  const response = await fetch(request.url, { cache: 'no-store' })
                  const original = await response.json()
                  const body = JSON.stringify(variants[activeVariant](original))
                  await Fetch.fulfillRequest({
                    requestId,
                    responseCode: 200,
                    responseHeaders: [
                      { name: 'Content-Type', value: 'application/manifest+json' },
                      { name: 'Cache-Control', value: 'no-store' },
                    ],
                    body: Buffer.from(body).toString('base64'),
                  })
                  return
                }
                await Fetch.continueRequest({ requestId })
              })().catch(async (error) => {
                console.error('intercept error', activeVariant, error)
                try { await Fetch.continueRequest({ requestId }) } catch {}
              })
            })

            try {
              await Promise.all([Page.enable(), Network.enable()])
              await Network.setCacheDisabled({ cacheDisabled: true })
              await Emulation.setDeviceMetricsOverride({
                width: 412,
                height: 915,
                deviceScaleFactor: 2.75,
                mobile: true,
              })
              await Network.setUserAgentOverride({
                userAgent:
                  'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36',
                platform: 'Android',
              })
              await Fetch.enable({ patterns: [{ urlPattern: '*manifest.webmanifest*', requestStage: 'Request' }] })

              const results = {}
              for (const variant of Object.keys(variants)) {
                activeVariant = variant
                await Page.navigate({ url: `https://trackdash.it/?pwa-ab=${encodeURIComponent(variant)}&t=${Date.now()}` })
                await sleep(5000)
                const manifest = await Page.getAppManifest()
                const installability = await Page.getInstallabilityErrors()
                const icons = await Page.getManifestIcons().catch((error) => ({ error: String(error) }))
                results[variant] = {
                  manifestErrors: manifest.errors,
                  parsedIcons: (manifest.manifest && manifest.manifest.icons) || null,
                  installabilityErrors: installability.installabilityErrors,
                  hasPrimaryIcon: Boolean(icons && icons.primaryIcon),
                  manifestBody: manifest.data ? JSON.parse(manifest.data).icons : null,
                }
              }

              console.log('TRACKDASH_PWA_AB_START')
              console.log(JSON.stringify(results, null, 2))
              console.log('TRACKDASH_PWA_AB_END')
            } finally {
              await client.close()
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
