name: PWA installability diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pwa-installability-diagnostic.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pwa-installability-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Test each TrackDash manifest variant in an isolated Chrome profile
        shell: bash
        run: |
          set -euo pipefail

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          "$CHROME_BIN" --version
          npm install --no-save --ignore-scripts chrome-remote-interface@0.33.3

          node <<'NODE'
          const { spawn } = require('node:child_process')
          const fs = require('node:fs/promises')
          const CDP = require('chrome-remote-interface')

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          const chromeBin = process.env.CHROME_BIN

          function pngDimensions(buffer) {
            if (buffer.length < 24) return null
            if (buffer.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') return null
            return { width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) }
          }

          async function fetchAsset(url) {
            const response = await fetch(url, { cache: 'no-store', redirect: 'follow' })
            const bytes = Buffer.from(await response.arrayBuffer())
            return {
              url,
              ok: response.ok,
              status: response.status,
              contentType: response.headers.get('content-type'),
              contentLength: response.headers.get('content-length'),
              finalUrl: response.url,
              bytes: bytes.length,
              pngDimensions: pngDimensions(bytes),
            }
          }

          async function waitForChrome(port) {
            const deadline = Date.now() + 30000
            while (Date.now() < deadline) {
              try {
                const response = await fetch(`http://127.0.0.1:${port}/json/version`)
                if (response.ok) return
              } catch {}
              await sleep(500)
            }
            throw new Error(`Chrome did not start on port ${port}`)
          }

          async function inspectVariant(name, replacement, index) {
            const port = 9222 + index
            const profile = `/tmp/trackdash-pwa-${name}`
            await fs.rm(profile, { recursive: true, force: true })

            const chrome = spawn(chromeBin, [
              '--headless=new',
              '--no-sandbox',
              '--disable-gpu',
              '--disable-dev-shm-usage',
              '--disable-background-networking',
              '--disable-component-update',
              '--disable-default-apps',
              '--no-first-run',
              '--no-default-browser-check',
              '--remote-debugging-address=127.0.0.1',
              `--remote-debugging-port=${port}`,
              `--user-data-dir=${profile}`,
              'about:blank',
            ], { stdio: ['ignore', 'ignore', 'ignore'] })

            let client
            try {
              await waitForChrome(port)
              client = await CDP({ port })
              const { Page, Network, Emulation, Fetch, Runtime } = client

              await Promise.all([Page.enable(), Network.enable(), Runtime.enable()])
              await Network.setCacheDisabled({ cacheDisabled: true })
              await Emulation.setDeviceMetricsOverride({ width: 412, height: 915, deviceScaleFactor: 2.75, mobile: true })
              await Network.setUserAgentOverride({
                userAgent: 'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36',
                platform: 'Android',
              })

              if (replacement) {
                Fetch.requestPaused(({ requestId, request }) => {
                  ;(async () => {
                    if (request.url === 'https://trackdash.it/manifest.webmanifest') {
                      await Fetch.fulfillRequest({
                        requestId,
                        responseCode: 200,
                        responseHeaders: [
                          { name: 'Content-Type', value: 'application/manifest+json' },
                          { name: 'Cache-Control', value: 'no-store' },
                        ],
                        body: Buffer.from(JSON.stringify(replacement)).toString('base64'),
                      })
                      return
                    }
                    await Fetch.continueRequest({ requestId })
                  })().catch(async () => {
                    try { await Fetch.continueRequest({ requestId }) } catch {}
                  })
                })
                await Fetch.enable({ patterns: [{ urlPattern: '*manifest.webmanifest*', requestStage: 'Request' }] })
              }

              await Page.navigate({ url: `https://trackdash.it/?pwa-isolated=${encodeURIComponent(name)}&t=${Date.now()}` })
              await sleep(8000)

              const manifest = await Page.getAppManifest()
              const installability = await Page.getInstallabilityErrors()
              const primary = await Page.getManifestIcons().catch((error) => ({ error: String(error) }))
              const runtime = await Runtime.evaluate({
                expression: `JSON.stringify({
                  url: location.href,
                  secureContext: isSecureContext,
                  serviceWorkerController: Boolean(navigator.serviceWorker && navigator.serviceWorker.controller),
                  beforeInstallPromptCached: Boolean(window.__trackdashInstallPrompt),
                  userAgent: navigator.userAgent
                })`,
                returnByValue: true,
              })

              return {
                manifestErrors: manifest.errors,
                manifestBody: manifest.data ? JSON.parse(manifest.data) : null,
                parsedIcons: manifest.manifest?.icons ?? null,
                installabilityErrors: installability.installabilityErrors,
                hasPrimaryIcon: Boolean(primary?.primaryIcon),
                primaryIconBytesBase64: primary?.primaryIcon ? primary.primaryIcon.length : 0,
                primaryIconError: primary?.error ?? null,
                runtime: runtime.result?.value ? JSON.parse(runtime.result.value) : null,
              }
            } finally {
              if (client) await client.close().catch(() => {})
              chrome.kill('SIGKILL')
              await sleep(500)
              await fs.rm(profile, { recursive: true, force: true })
            }
          }

          ;(async () => {
            const original = await (await fetch('https://trackdash.it/manifest.webmanifest', { cache: 'no-store' })).json()
            const variants = {
              baselineDirect: null,
              baselineRefetched: original,
              legacyV4: {
                ...original,
                icons: [
                  { src: '/pwa/icon-v4.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                  { src: '/pwa/icon-v4.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
                ],
              },
              v5SingleAny512: {
                ...original,
                icons: [{ src: '/pwa/icon-v5.png', sizes: '512x512', type: 'image/png', purpose: 'any' }],
              },
              v5PurposeOmitted: {
                ...original,
                icons: [
                  { src: '/pwa/icon-v5-192.png', sizes: '192x192', type: 'image/png' },
                  { src: '/pwa/icon-v5.png', sizes: '512x512', type: 'image/png' },
                ],
              },
              minimalAbsoluteV4: {
                id: '/', name: 'TrackDash', short_name: 'TrackDash', start_url: '/', scope: '/', display: 'standalone',
                icons: [{ src: 'https://trackdash.it/pwa/icon-v4.png', sizes: '512x512' }],
              },
              minimalAbsoluteV5: {
                id: '/', name: 'TrackDash', short_name: 'TrackDash', start_url: '/', scope: '/', display: 'standalone',
                icons: [{ src: 'https://trackdash.it/pwa/icon-v5.png', sizes: '512x512' }],
              },
            }

            const assets = await Promise.all([
              fetchAsset('https://trackdash.it/pwa/icon-v4.png'),
              fetchAsset('https://trackdash.it/pwa/icon-v5-192.png'),
              fetchAsset('https://trackdash.it/pwa/icon-v5.png'),
              fetchAsset('https://trackdash.it/pwa/icon-v5-maskable.png'),
            ])

            const results = {}
            let index = 0
            for (const [name, replacement] of Object.entries(variants)) {
              results[name] = await inspectVariant(name, replacement, index++)
            }

            console.log('TRACKDASH_PWA_ISOLATED_START')
            console.log(JSON.stringify({ assets, results }, null, 2))
            console.log('TRACKDASH_PWA_ISOLATED_END')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
