name: PWA Android Chrome diagnostic

on:
  push:
    branches:
      - diag/pwa-known-good-20260912
    paths:
      - ".github/workflows/pwa-android-chrome-diagnostic.yml"
      - ".github/scripts/pwa-android-diagnostic.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android with Google Play and inspect real Chrome
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          script: bash .github/scripts/pwa-android-diagnostic.sh
