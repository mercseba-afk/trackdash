name: Market retail probe

on:
  push:
    branches:
      - feat/market-retail-probe-20260918
    paths:
      - ".github/workflows/market-retail-probe.yml"
      - "scripts/probe-market-retail-pages.mjs"
      - "lib/market/automation/exact-page-adapter.ts"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_RETAIL_PROBE_TARGETS: '[{"slug":"tamiya_usa_public","url":"https://www.tamiyausa.com/shop/132-super/jr-dash-1-emperor-premium/","itemNumber":"18069"},{"slug":"imodellini_public","url":"https://www.imodellini.it/mini4wd/mini-4wd-jr-dash-1-emperor-premium-con-telaio-super-ii-tamiya-18069?limit=100","itemNumber":"18069"},{"slug":"plaza_japan_public","url":"https://www.plazajapan.com/4950344063871/","itemNumber":"18069"},{"slug":"pieroni_public","url":"https://www.pieronimodellismo.it/tamiya-mini-4wd-dash-1-emperor-premium-super-ii-chassis-18069-8248.html","itemNumber":"18069"},{"slug":"rcjaz_category_probe","url":"https://www.rcjaz.com/tamiya-mini-4wd-car-kit-super-ii-chassis-c-4472_129_137_4120.html","itemNumber":"18069"}]'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe exact retail pages
        run: node --experimental-strip-types scripts/probe-market-retail-pages.mjs
