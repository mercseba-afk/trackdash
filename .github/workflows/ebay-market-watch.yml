name: eBay Market Watch

on:
  schedule:
    - cron: '41 */3 * * *'
  # Re-run the protected market-watch smoke check after Production is READY.
  # Regular execution remains the three-hour schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ebay-market-watch.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: trackdash-ebay-market-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request scoped GitHub OIDC token and run bounded TrackDash scan
        shell: bash
        env:
          SCAN_URL: https://trackdash.it/api/cron/ebay-scan
        run: |
          set -euo pipefail
          token="$(curl -fsS --retry 2 --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trackdash-ebay-scan" | jq -er '.value')"
          # Do not retry a potentially timed-out POST-like scan: a retry may
          # claim another batch while the previous Vercel function is dying.
          status="$(curl -sS --max-time 75 -o result.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            "${SCAN_URL}")"
          unset token
          jq '{ok, summary: .result | {attempted, succeeded, failed, acceptedListings, reviewListings}}' result.json
          test "${status}" = "200"
          jq -e '.ok == true' result.json >/dev/null
