name: eBay Market Watch

on:
  schedule:
    - cron: '41 * * * *'
  # Dispatch up to ONE due Release hourly; individual Mini 4WD Releases
  # retain a 7–45-day adaptive scan interval. More frequent dispatch does NOT
  # rescan every Release hourly, and failed scans are never auto-retried.
  # Push remains the protected post-deployment smoke check.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ebay-market-watch.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: trackdash-ebay-market-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Request scoped GitHub OIDC token and run bounded TrackDash scan
        shell: bash
        env:
          SCAN_URL: https://trackdash.it/api/cron/ebay-scan
        run: |
          set -euo pipefail
          # Tokens and untrusted responses must never reach tracing/raw logs.
          set +x
          token="$(curl -fsS --retry 2 --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trackdash-ebay-scan" 2>/dev/null | jq -er '.value' 2>/dev/null)" || {
            echo 'OIDC_TOKEN_REQUEST_FAILED'
            exit 1
          }
          echo "::add-mask::${token}"
          trap 'rm -f result.json' EXIT
          # Do not retry a potentially timed-out POST-like scan: a retry may
          # claim another batch while the previous Vercel function is dying.
          curl_exit=0
          status="$(curl -sS --max-time 75 -o result.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            "${SCAN_URL}" 2>/dev/null)" || curl_exit=$?
          unset token
          node --experimental-strip-types scripts/ebay-market-watch-diagnostics.mjs result.json "${status}" "${curl_exit}"
