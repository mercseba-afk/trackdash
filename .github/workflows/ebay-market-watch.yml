name: eBay Market Watch

on:
  schedule:
    - cron: '41 */3 * * *'
  # Do not enable workflow_dispatch without adjusting the OIDC event gate.

permissions:
  contents: read
  id-token: write

concurrency:
  group: trackdash-ebay-market-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request scoped GitHub OIDC token and run bounded TrackDash scan
        shell: bash
        env:
          SCAN_URL: https://trackdash.it/api/cron/ebay-scan
        run: |
          set -euo pipefail
          token="$(curl -fsS --retry 2 --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trackdash-ebay-scan" | jq -er '.value')"
          status="$(curl -sS --retry 2 --max-time 100 -o result.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/json' \
            "${SCAN_URL}")"
          unset token
          jq '{ok, summary: .result | {attempted, succeeded, failed, acceptedListings, reviewListings}}' result.json
          test "${status}" = "200"
          jq -e '.ok == true' result.json >/dev/null
