name: TrackDash branch verify

on:
  push:
    branches:
      - market-europe-first-manta-mkii
  pull_request:
    branches:
      - main
      - recovery/frankfurt-migration
      - perf/p08-ebay-erasure-cpu-20261017
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The isolated webhook regression reads a pinned historical baseline.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: P0.8 isolated webhook / PostgreSQL / PostgREST regression and load
        if: ${{ hashFiles('proposals/p08-ebay-erasure.sql') != '' }}
        timeout-minutes: 10
        env:
          P08_TEST_CONTAINER: trackdash-p08-isolated
        run: |
          docker run --detach --name "$P08_TEST_CONTAINER" --network none \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          trap 'docker rm --force "$P08_TEST_CONTAINER"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$P08_TEST_CONTAINER" pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker pull postgrest/postgrest:v13.0.7@sha256:0a46780309a604cdc8b56c776c6e5e15788ce58174d709e40459ab5a2d44d228
          node --experimental-strip-types scripts/test-p08-ebay-erasure.mjs
          node --experimental-strip-types scripts/test-p09-pooler.mjs
