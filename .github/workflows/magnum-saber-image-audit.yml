name: Magnum Saber image audit

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sources and candidate images
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.request
          from urllib.parse import urljoin

          pages={
            "94618_tamiyausa":"https://www.tamiyausa.com/shop/132-super/jr-magnum-saber-special-kit/",
            "tokyo_official":"https://tokyoanimecenter.jp/event/letsgo_30exh/",
            "tokyo_atpress":"https://www.atpress.ne.jp/news/7275106",
          }
          ua="Mozilla/5.0 (compatible; TrackDash image audit/1.0)"
          patterns=[
            r'<meta[^>]+(?:property|name)=["\']og:image(?::secure_url)?["\'][^>]+content=["\']([^"\']+)["\']',
            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\']og:image(?::secure_url)?["\']',
            r'<img[^>]+(?:src|data-src|data-original)=["\']([^"\']+)["\']'
          ]
          for key,url in pages.items():
            print("\n===",key,url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":ua})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode("utf-8","ignore")
                print("HTTP",r.status,"FINAL",r.geturl(),"LEN",len(raw))
            except Exception as e:
              print("FETCH_ERROR",repr(e)); continue
            found=[]
            for pat in patterns:
              for m in re.finditer(pat,raw,re.I):
                u=html.unescape(m.group(1)).strip()
                if not u or u.startswith("data:"): continue
                u=urljoin(url,u)
                if u not in found: found.append(u)
            for i,u in enumerate(found[:100],1):
              low=u.lower()
              mark=" <== LIKELY" if any(x in low for x in ["94618","magnum","letsgo","7275106","mini4","goods"]) else ""
              print(f"IMG {i:03d} {u}{mark}")

          # Suruga First Impact management-number sequence: validate bytes only;
          # identity is accepted only if paired with exact source/title evidence.
          for mid in ["603059995","603059996","603059997","603059998"]:
            u=f"https://cdn.suruga-ya.jp/database/pics_webp/game/{mid}.jpg.webp"
            try:
              req=urllib.request.Request(u,headers={"User-Agent":ua})
              with urllib.request.urlopen(req,timeout=20) as r:
                data=r.read()
                print("SURUGA_CDN",mid,"HTTP",r.status,"CT",r.headers.get("content-type"),"LEN",len(data),"FINAL",r.geturl())
            except Exception as e:
              print("SURUGA_CDN_ERROR",mid,repr(e))
          PY

      - name: Render Suruga candidate product pages
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          echo "CHROME=$CHROME"
          [ -z "$CHROME" ] && exit 0
          for MID in 603059995 603059996 603059997 603059998; do
            URL="https://www.suruga-ya.jp/product/detail/$MID"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "$URL" > "/tmp/$MID.html" 2>/dev/null || true
            python3 - "$MID" <<'PY'
          import sys,re,html
          mid=sys.argv[1]
          raw=open(f"/tmp/{mid}.html","r",encoding="utf-8",errors="ignore").read()
          tm=re.search(r'<title[^>]*>(.*?)</title>',raw,re.I|re.S)
          title=html.unescape(re.sub(r'<[^>]+>',' ',tm.group(1))).strip() if tm else ""
          print("SURUGA_PAGE",mid,"LEN",len(raw),"TITLE",re.sub(r'\s+',' ',title))
          for needle in ["92318","92319","92320","92321","ブルー","レッド","ホワイト","グレイ"]:
            if needle in raw: print("SURUGA_HIT",mid,needle)
          PY
          done
      - name: Resolve exact Suruga mapping and official product assets
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.request
          from urllib.parse import quote,urljoin
          ua="Mozilla/5.0 (compatible; TrackDash image audit/1.0)"
          for item in ["92318","92319"]:
            url="https://www.suruga-ya.jp/search?search_word="+quote(item)
            print("\nSEARCH",item,url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":ua})
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read().decode("utf-8","ignore")
              print("SEARCH_LEN",len(raw))
              for m in re.finditer(item,raw):
                sn=html.unescape(raw[max(0,m.start()-5000):m.start()+8000])
                hrefs=re.findall(r'href=["\']([^"\']+)["\']',sn,re.I)
                print("ITEM_HIT",item,"HREFS",[h for h in hrefs if "product/detail" in h or "kaitori_detail" in h][:20])
                print("ITEM_SNIP",re.sub(r"\s+"," ",sn)[:5000])
                break
            except Exception as e:
              print("SEARCH_ERROR",item,repr(e))

          # Tamiya USA exact Special Kit page: expose all likely product asset URLs.
          url="https://www.tamiyausa.com/shop/132-super/jr-magnum-saber-special-kit/"
          req=urllib.request.Request(url,headers={"User-Agent":ua})
          with urllib.request.urlopen(req,timeout=25) as r:
            raw=r.read().decode("utf-8","ignore")
          urls=[]
          for m in re.finditer(r'https?://[^"\'<> ]+',html.unescape(raw)):
            u=m.group(0).replace("\\u0026","&")
            if any(x in u.lower() for x in ["94618","products/94618","magnum-saber"]):
              if u not in urls: urls.append(u)
          print("TAMIYAUSA_94618_URLS",urls[:50])

          # Official Tokyo page: find the image immediately around the product name.
          url="https://tokyoanimecenter.jp/event/letsgo_30exh/"
          req=urllib.request.Request(url,headers={"User-Agent":ua})
          with urllib.request.urlopen(req,timeout=25) as r:
            raw=r.read().decode("utf-8","ignore")
          for needle in ["マグナムセイバー 東京アニメセンターモデル","コラボミニ四駆"]:
            p=raw.find(needle)
            print("TOKYO_NEEDLE",needle,"POS",p)
            if p>=0:
              sn=html.unescape(raw[max(0,p-5000):p+5000])
              imgs=re.findall(r'<img[^>]+(?:src|data-src)=["\']([^"\']+)["\']',sn,re.I)
              print("TOKYO_NEAR_IMAGES",[urljoin(url,u) for u in imgs])
              print("TOKYO_SNIP",re.sub(r"\s+"," ",sn)[:7000])
          PY
