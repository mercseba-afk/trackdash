name: Cron auth probe

on:
  push:
    branches:
      - diag/cron-auth-20260918
    paths:
      - ".github/workflows/cron-auth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe unauthenticated production cron
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o response.txt -w "%{http_code}" https://trackdash.it/api/cron/market-scan)"
          echo "HTTP_STATUS=$code"
          cat response.txt
          test "$code" = "401"
