name: Avante Mk.III image audit

on:
  push:
    branches:
      - legacy-avante-mk3-master-audit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact-item image candidates
        shell: bash
        run: |
          set +e
          check() {
            item="$1"
            url="$2"
            meta=$(curl -L --max-time 15 -sS -o /tmp/avante-image -w "%{http_code} %{content_type} %{size_download}" "$url")
            echo "$item $meta $url"
          }
          check 18626 https://www.tamiya.com/japan_contents/img/usr/item/1/18626/18626_1.jpg
