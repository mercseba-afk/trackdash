<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/pwa-debug/lab-20260918/manifest.webmanifest">
  <title>TrackDash PWA Lab</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:32px 20px;background:#f8fafc;color:#0f172a}
    .card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px}
    button{font:inherit;padding:12px 16px;border:0;border-radius:10px;background:#0f172a;color:white}
    button:disabled{opacity:.45}
    code{word-break:break-all}
    #status{font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>TrackDash PWA Lab</h1>
    <p>Pagina statica isolata: niente React, Supabase, auth o service worker principale.</p>
    <p>Stato: <span id="status">inizializzazione…</span></p>
    <p id="detail"></p>
    <button id="engage">Avvia test installazione</button>
    <button id="install" disabled>Apri prompt nativo</button>
  </main>
<script>
(() => {
  const status = document.getElementById("status");
  const detail = document.getElementById("detail");
  const engage = document.getElementById("engage");
  const install = document.getElementById("install");
  let deferredPrompt = null;
  let timer = null;

  const standalone = () =>
    matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  function render(message, extra="") {
    status.textContent = message;
    detail.textContent = extra;
  }

  if (standalone()) render("STANDALONE", "Questa mini-PWA è già aperta come app.");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/pwa-debug/lab-20260918/sw.js", {
      scope: "/pwa-debug/lab-20260918/"
    }).then(() => navigator.serviceWorker.ready)
      .then(() => {
        if (!standalone()) render("SW READY", "Tocca “Avvia test installazione”.");
      })
      .catch((error) => render("SW ERROR", String(error)));
  } else {
    render("NO SERVICE WORKER", "Browser senza supporto Service Worker.");
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    install.disabled = false;
    render("PROMPT NATIVO DISPONIBILE", "Chrome considera questa mini-PWA promuovibile.");
  });

  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    install.disabled = true;
    render("INSTALLATA", "Evento appinstalled ricevuto.");
  });

  engage.addEventListener("click", () => {
    let remaining = 35;
    engage.disabled = true;
    render("ENGAGEMENT ATTIVO", remaining + " secondi…");
    timer = setInterval(() => {
      remaining -= 1;
      if (deferredPrompt) {
        clearInterval(timer);
        return;
      }
      if (remaining <= 0) {
        clearInterval(timer);
        render("NESSUN PROMPT DIRETTO", "Ora apri ⋮ → “Installa e crea scorciatoia” e verifica se compare “Installa”.");
      } else {
        detail.textContent = remaining + " secondi…";
      }
    }, 1000);
  });

  install.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    const prompt = deferredPrompt;
    await prompt.prompt();
    const choice = await prompt.userChoice;
    deferredPrompt = null;
    install.disabled = true;
    render("SCELTA: " + choice.outcome.toUpperCase(), "Risposta del prompt nativo.");
  });
})();
</script>
</body>
</html>
